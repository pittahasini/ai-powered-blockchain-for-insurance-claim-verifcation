<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Powered Blockchain Insurance Claim Verification</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;display:flex;}
.sidebar{width:220px;background:#0f172a;color:white;height:100vh;padding-top:25px;position:fixed;}
.sidebar h2{text-align:center;margin-bottom:30px;}
.sidebar button{width:100%;background:none;border:none;color:white;padding:15px;text-align:left;cursor:pointer;font-size:16px;}
.sidebar button:hover{background:#1e293b;}
.main{margin-left:220px;width:100%;padding:25px;}
.topbar{background:white;padding:15px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.08);margin-bottom:25px;}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.card h3{margin:0;color:#64748b;}
.card h1{margin-top:10px;}
.meter{height:20px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:10px;}
.meter-bar{height:100%;width:0%;background:#ef4444;transition:1s;}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;}
button.submit{background:#2563eb;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;}
button.submit:hover{background:#1d4ed8;}
section{display:none;}
.active{display:block;}
img#highlighted{max-width:400px;margin-top:10px;border-radius:8px;}
</style>
</head>
<body>

<div class="sidebar">
<h2>Insurance AI</h2>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('claim')">Submit Claim</button>
<button onclick="show('analytics')">Analytics</button>
<button onclick="show('blockchain');loadBlockchain()">Blockchain</button>
</div>

<div class="main">
<div class="topbar"><h2>AI Powered Blockchain Insurance Claim Verification</h2></div>

<section id="dashboard" class="active">
<div class="dashboard">
<div class="card"><h3>Total Claims</h3><h1 id="total">0</h1></div>
<div class="card"><h3>Approved</h3><h1 id="approved">0</h1></div>
<div class="card"><h3>Fraud Detected</h3><h1 id="fraud">0</h1></div>
<div class="card"><h3>Fraud Risk Score</h3><div class="meter"><div class="meter-bar" id="riskBar"></div></div><p id="riskText">0%</p></div>
</div>
</section>

<section id="claim">
<div class="card">
<h2>Submit Claim</h2>
<form id="claimForm">
<label>Insurance Type</label>
<select id="insuranceType" onchange="updateInsurance()">
<option value="Vehicle">Vehicle</option>
<option value="Health">Health</option>
<option value="Crop">Crop</option>
</select>

<div id="vehicleSection">
<label>Vehicle Type</label>
<select>
<option>Car</option><option>Bike</option><option>Truck</option>
</select>
</div>

<label>Claim Amount (₹)</label>
<input type="number" id="claim_amount" required>
<label>Policy Age (Years)</label>
<input type="number" id="policy_age" required>
<label>Previous Claims</label>
<input type="number" id="prev_claims" required>
<label id="evidenceLabel">Upload Evidence</label>
<input type="file" id="evidence">

<img id="highlighted" style="display:none;">
<button class="submit">Submit Claim</button>
</form>

<p id="result"></p>
<p id="aiStatus" style="color:#2563eb;font-weight:bold"></p>
</div>
</section>

<section id="analytics">
<div class="card"><h2>Claim Analytics</h2><canvas id="chart"></canvas></div>
</section>

<section id="blockchain">
<div class="card"><h2>Blockchain Records</h2><div id="blockList" style="max-height:400px;overflow:auto;"></div></div>
</section>

</div>

<script>
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function updateInsurance(){
let type=document.getElementById("insuranceType").value;
document.getElementById("vehicleSection").style.display = (type==="Vehicle") ? "block":"none";
document.getElementById("evidenceLabel").innerText = (type==="Vehicle")?"Upload Accident Image":(type==="Crop")?"Upload Crop Image":"";
document.getElementById("evidence").required = (type!=="Health");
}

let total=0, approved=0, fraud=0;
let chart=new Chart(document.getElementById("chart"),{type:"bar",data:{labels:["Approved","Fraud"],datasets:[{label:"Claims",data:[0,0]}]}});

document.getElementById("claimForm").addEventListener("submit", function(e){
e.preventDefault();
document.getElementById("aiStatus").innerText="🤖 AI analyzing claim...";
let formData=new FormData();
formData.append("insurance_type",document.getElementById("insuranceType").value);
formData.append("claim_amount",document.getElementById("claim_amount").value);
formData.append("policy_age",document.getElementById("policy_age").value);
formData.append("prev_claims",document.getElementById("prev_claims").value);
if(document.getElementById("evidence").files[0]) formData.append("file",document.getElementById("evidence").files[0]);

fetch("http://127.0.0.1:5000/verify",{method:"POST",body:formData})
.then(res=>res.json())
.then(data=>{
document.getElementById("aiStatus").innerText="✅ AI analysis completed";

total++;
if(data.claim_status=="Approved") approved++; else fraud++;
document.getElementById("total").innerText=total;
document.getElementById("approved").innerText=approved;
document.getElementById("fraud").innerText=fraud;
chart.data.datasets[0].data=[approved,fraud];
chart.update();

updateFraudMeter(data.fraud_score);

// Show highlighted damage if any
if(data.highlighted_image){
let img=document.getElementById("highlighted");
img.src="data:image/jpeg;base64,"+data.highlighted_image;
img.style.display="block";
} else document.getElementById("highlighted").style.display="none";

document.getElementById("result").innerText="Claim Status: "+data.claim_status+" | "+data.accident_analysis;

show("dashboard");
});
});

function updateFraudMeter(score){
let bar=document.getElementById("riskBar");
bar.style.width=score+"%";
document.getElementById("riskText").innerText=score+"% Fraud Risk";
bar.style.background = (score<30)?"#22c55e":(score<70)?"#f59e0b":"#ef4444";
}

function loadBlockchain(){
fetch("http://127.0.0.1:5000/blockchain")
.then(res=>res.json())
.then(data=>{
let html="";
data.forEach((block,index)=>{
html+=`<div style="background:white;padding:15px;border-radius:10px;margin:10px 0;box-shadow:0 4px 8px rgba(0,0,0,0.1);border-left:5px solid #2563eb">
<h4>🔗 Block #${block.block_index}</h4>
<p>Status: ${block.claim_status}</p>
<p>Fraud Score: ${block.fraud_score}</p>
<p>Insurance: ${block.insurance_type}</p>
<p>Claim Amount: ₹${block.claim_amount}</p>
<p>Prev Hash: ${block.prev_hash}</p>
<p>Block Hash: ${block.block_hash}</p>
</div>`;
if(index<data.length-1) html+=`<div style="text-align:center;font-size:20px">⬇</div>`;
});
document.getElementById("blockList").innerHTML=html;
});
}
</script>
</body>
</html>
